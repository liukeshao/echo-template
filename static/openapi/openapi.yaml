openapi: 3.1.0
info:
  title: Echo Template API
  version: 0.0.0
tags:
  - name: auth
  - name: me
  - name: books
paths:
  /api/v1/auth/login:
    post:
      operationId: Auth_login
      description: 用户登录
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: Auth_logout
      description: 用户登出（撤销该用户全部活跃令牌）
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      security:
        - BearerAuth: []
  /api/v1/auth/refresh:
    post:
      operationId: Auth_refreshToken
      description: 刷新访问令牌
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
  /api/v1/auth/register:
    post:
      operationId: Auth_register
      description: 用户注册
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/books:
    post:
      operationId: Books_create
      description: 创建书籍
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      security:
        - BearerAuth: []
    get:
      operationId: Books_list
      description: 获取书籍列表
      parameters:
        - $ref: '#/components/parameters/ListQuery.page'
        - $ref: '#/components/parameters/ListQuery.page_size'
        - $ref: '#/components/parameters/ListQuery.order_by'
        - $ref: '#/components/parameters/ListQuery.filter'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      security:
        - BearerAuth: []
  /api/v1/books/{book}:
    get:
      operationId: Books_get
      description: 获取书籍详情
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      security:
        - BearerAuth: []
    put:
      operationId: Books_replace
      description: 全量替换书籍（幂等 PUT）
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBookRequest'
      security:
        - BearerAuth: []
    patch:
      operationId: Books_patch
      description: 局部更新书籍（支持 RFC 7386 Merge Patch / RFC 6902 JSON Patch / Shorthand）
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
          application/json-patch+json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
          application/merge-patch+shorthand:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
          application/json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
      security:
        - BearerAuth: []
    delete:
      operationId: Books_delete
      description: 删除书籍
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      security:
        - BearerAuth: []
  /api/v1/me:
    get:
      operationId: Me_get
      description: 获取当前用户信息
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      security:
        - BearerAuth: []
    put:
      operationId: Me_replace
      description: 替换当前用户资料（幂等全量更新）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceMeRequest'
      security:
        - BearerAuth: []
    patch:
      operationId: Me_patch
      description: 局部更新当前用户资料（支持 RFC 7386 Merge Patch / RFC 6902 JSON Patch / Shorthand）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
          application/json-patch+json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
          application/merge-patch+shorthand:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
          application/json:
            schema:
              anyOf:
                - type: object
                  additionalProperties: {}
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonPatchOperation'
                - type: string
      security:
        - BearerAuth: []
  /api/v1/me/change-password:
    post:
      operationId: Me_changePassword
      description: 修改当前用户密码
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      security:
        - BearerAuth: []
components:
  parameters:
    ListQuery.filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      explode: false
    ListQuery.order_by:
      name: order_by
      in: query
      required: false
      schema:
        type: string
      explode: false
    ListQuery.page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 1
      explode: false
    ListQuery.page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000
        default: 50
      explode: false
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        title:
          type: string
        author:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BookList:
      type: object
      required:
        - items
        - page
        - page_size
        - total_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        total_size:
          type: integer
          format: int32
    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          $ref: '#/components/schemas/Password'
    CreateBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        book_id:
          $ref: '#/components/schemas/ULID'
          description: Optional custom ULID. Auto-generated when omitted.
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: number
          format: double
          minimum: 0
        published_at:
          type: string
          format: date-time
    Email:
      type: string
      format: email
      description: RFC 5322 email address
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    JsonPatchOperation:
      type: object
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
        from:
          type: string
        value: {}
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: Password (8-128 chars, must include at least one letter and one digit)
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: RFC 9457 Problem Details
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
    ReplaceBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: number
          format: double
          minimum: 0
        published_at:
          type: string
          format: date-time
    ReplaceMeRequest:
      type: object
      required:
        - username
        - email
      properties:
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: integer
          format: int64
    ULID:
      type: string
      minLength: 26
      maxLength: 26
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      description: 26-character ULID identifier
    User:
      type: object
      required:
        - id
        - username
        - email
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ULID'
        username:
          type: string
        email:
          type: string
        status:
          type: string
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: ^[a-zA-Z0-9_-]+$
      description: Username (3-50 chars, letters/digits/underscore/hyphen)
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8000
    description: Local development server
    variables: {}
