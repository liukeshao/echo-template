openapi: 3.1.0
info:
  title: Echo Template API
  version: 0.0.0
tags:
  - name: auth
  - name: me
  - name: books
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      description: 用户登录
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      description: 用户登出（撤销该用户全部活跃令牌）
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      security:
        - BearerAuth: []
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      description: 刷新访问令牌
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
  /api/v1/auth/register:
    post:
      operationId: register
      description: 用户注册
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/books:
    post:
      operationId: createBook
      description: 创建书籍
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      security:
        - BearerAuth: []
    get:
      operationId: listBooks
      description: 获取书籍列表
      parameters:
        - $ref: '#/components/parameters/ListQuery.page'
        - $ref: '#/components/parameters/ListQuery.page_size'
        - $ref: '#/components/parameters/ListQuery.order_by'
        - name: title
          in: query
          required: false
          description: 按书名模糊匹配
          schema:
            type: string
          explode: false
        - name: author
          in: query
          required: false
          description: 按作者模糊匹配
          schema:
            type: string
          explode: false
        - name: min_price
          in: query
          required: false
          description: 最低价格（含）
          schema:
            type: number
            format: double
            minimum: 0
          explode: false
        - name: max_price
          in: query
          required: false
          description: 最高价格（含）
          schema:
            type: number
            format: double
            minimum: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      security:
        - BearerAuth: []
  /api/v1/books/{book}:
    get:
      operationId: getBook
      description: 获取书籍详情
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      security:
        - BearerAuth: []
    put:
      operationId: replaceBook
      description: 全量替换书籍（幂等 PUT）
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBookRequest'
      security:
        - BearerAuth: []
    patch:
      operationId: patchBook
      description: 局部更新书籍（RFC 7386 JSON Merge Patch）
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchBookRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBookRequest'
      security:
        - BearerAuth: []
    delete:
      operationId: deleteBook
      description: 删除书籍
      parameters:
        - name: book
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - books
      security:
        - BearerAuth: []
  /api/v1/me:
    get:
      operationId: getMe
      description: 获取当前用户信息
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      security:
        - BearerAuth: []
    put:
      operationId: replaceMe
      description: 替换当前用户资料（幂等全量更新）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceMeRequest'
      security:
        - BearerAuth: []
    patch:
      operationId: patchMe
      description: 局部更新当前用户资料（RFC 7386 JSON Merge Patch）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      security:
        - BearerAuth: []
  /api/v1/me/change-password:
    post:
      operationId: changePassword
      description: 修改当前用户密码
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      security:
        - BearerAuth: []
components:
  parameters:
    ListQuery.order_by:
      name: order_by
      in: query
      required: false
      description: Comma-separated sort clauses, e.g. "created_at desc, title".
      schema:
        type: string
      explode: false
    ListQuery.page:
      name: page
      in: query
      required: false
      description: 1-based page number (0 or omitted defaults to 1).
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 1
      explode: false
    ListQuery.page_size:
      name: page_size
      in: query
      required: false
      description: Items per page (0 or omitted defaults to 50; values above 1000 are clamped to 1000).
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 50
      explode: false
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        author:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BookList:
      type: object
      required:
        - items
        - page
        - page_size
        - total_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        total_size:
          type: integer
          format: int32
    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          $ref: '#/components/schemas/Password'
    CreateBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        book_id:
          $ref: '#/components/schemas/UUID'
          description: Optional custom UUID. Auto-generated when omitted.
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: number
          format: double
          minimum: 0
        published_at:
          type: string
          format: date-time
    DecodeInfo:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
        offset:
          type: integer
          format: int64
      description: Metadata for JSON request body decoding errors.
    Email:
      type: string
      maxLength: 255
      format: email
      description: RFC 5322 email address
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
    MethodInfo:
      type: object
      required:
        - method
        - path
      properties:
        method:
          type: string
        path:
          type: string
        allowed:
          type: array
          items:
            type: string
      description: Metadata for HTTP 405 Method Not Allowed responses.
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: Password (8-72 bytes, must include at least one letter and one digit)
    PatchBookRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        description:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 1000
        price:
          anyOf:
            - type: number
              format: double
            - type: 'null'
          minimum: 0
        published_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      description: RFC 7386 JSON Merge Patch for Book (omit field to keep, set null to clear optional fields).
    PatchInfo:
      type: object
      required:
        - content_type
      properties:
        content_type:
          type: string
        supported:
          type: array
          items:
            type: string
        reason:
          type: string
        field:
          type: string
      description: Metadata for PATCH document or media type errors.
    PatchMeRequest:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
      description: RFC 7386 JSON Merge Patch for current user profile (omit field to keep).
    PreconditionInfo:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        subject:
          type: string
        detail:
          type: string
      description: 'AIP-193 PreconditionInfo: describes a failed precondition or credential state.'
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        metadata:
          anyOf:
            - $ref: '#/components/schemas/ResourceInfo'
            - $ref: '#/components/schemas/PreconditionInfo'
            - $ref: '#/components/schemas/RetryInfo'
            - $ref: '#/components/schemas/ValidationInfo'
            - $ref: '#/components/schemas/DecodeInfo'
            - $ref: '#/components/schemas/PatchInfo'
            - $ref: '#/components/schemas/MethodInfo'
            - $ref: '#/components/schemas/RequestLimitInfo'
            - type: object
              additionalProperties: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: RFC 9457 Problem Details
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
    ReplaceBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        price:
          type: number
          format: double
          minimum: 0
        published_at:
          type: string
          format: date-time
    ReplaceMeRequest:
      type: object
      required:
        - username
        - email
      properties:
        username:
          $ref: '#/components/schemas/Username'
        email:
          $ref: '#/components/schemas/Email'
    RequestLimitInfo:
      type: object
      required:
        - max_bytes
      properties:
        max_bytes:
          type: integer
          format: int64
      description: Metadata for HTTP 413 Content Too Large responses.
    ResourceInfo:
      type: object
      required:
        - resource_type
        - resource_name
      properties:
        resource_type:
          type: string
        resource_name:
          type: string
        field:
          type: string
      description: 'AIP-193 ResourceInfo: describes a missing or conflicting resource.'
    RetryInfo:
      type: object
      required:
        - service
      properties:
        service:
          type: string
        retry_after:
          type: string
      description: 'AIP-193 RetryInfo: describes rate limiting and suggested retry window.'
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: integer
          format: int64
    UUID:
      type: string
      minLength: 36
      maxLength: 36
      format: uuid
      description: RFC 9562 UUID identifier
    User:
      type: object
      required:
        - id
        - username
        - email
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        username:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended
    Username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: ^[a-zA-Z0-9_-]+$
      description: Username (3-50 chars, letters/digits/underscore/hyphen)
    ValidationInfo:
      type: object
      required:
        - error_count
      properties:
        error_count:
          type: integer
          format: int32
      description: Summary metadata for field validation failures.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8000
    description: Local development server
    variables: {}
