# English translations.
# Structure:
#   [errors]            1:1 with the 13 finite HTTP error statuses in pkg/httperr (100% required).
#   [details.<STATUS>]  optional fine-grained overrides indexed by httperr.Metadata.I18nSubkeys().
#   [validation]        1:1 with validation rule codes registered in pkg/validator (100% required).
#
# Placeholders use the {name} form and are populated by httperr.Metadata.I18nVars()
# or validator.Violation metadata (with {field} auto-injected). Missing vars are kept verbatim.

[errors]
400 = "Invalid request."
401 = "Authentication required or invalid credentials."
403 = "Access to this resource is forbidden."
404 = "The requested resource was not found."
405 = "HTTP method not allowed for this resource."
409 = "The request conflicts with the current state of the resource."
413 = "Request body exceeds the maximum allowed size."
415 = "Unsupported media type."
429 = "Rate limit exceeded. Please retry later."
499 = "Client closed the request before the server could respond."
500 = "An internal server error occurred."
503 = "Service is temporarily unavailable."
504 = "The request timed out."

[details.400]
validation       = "Request validation failed."
decode           = "Invalid JSON request body."
patch            = "Invalid patch document for content type {content_type}."
INVALID_PASSWORD = "Current password is incorrect."

[details.401]
INVALID_CREDENTIALS = "Invalid email or password."
TOKEN_EXPIRED       = "Token has expired."
TOKEN_INVALID       = "Invalid or expired token."
TOKEN_REVOKED       = "Token has been revoked."
MISSING_HEADER      = "Missing Authorization header."
MALFORMED_HEADER    = "Invalid Authorization header format."
EMPTY_TOKEN         = "Bearer token is empty."

[details.403]
ACCOUNT_DISABLED = "This account has been disabled."

[details.404]
book = "Book {resource_name} was not found."

[details.409]
user.email    = "The email {resource_name} is already in use."
user.username = "The username {resource_name} is already taken."
book.book_id  = "Book {resource_name} already exists. Please use a different book_id."

[details.413]
body_limit = "Request body exceeds the maximum allowed size ({max_bytes} bytes)."

[details.415]
patch = "Unsupported PATCH content type {content_type}; supported: {supported}."

[details.429]
weather = "Weather service rate limit exceeded. Please retry later."

[validation]
required                   = "{field} is required."
min_length                 = "{field} must be at least {min} characters."
max_length                 = "{field} must be at most {max} characters."
max_bytes                  = "{field} must be at most {max} bytes."
email                      = "{field} must be a valid email address."
password_weak              = "{field} must contain at least one letter and one digit."
integer                    = "{field} must be a valid integer."
number                     = "{field} must be a valid number."
boolean                    = "{field} must be a valid boolean."
non_negative               = "{field} must be non-negative."
min_value                  = "{field} must be at least {min}."
max_value                  = "{field} must be at most {max}."
pattern                    = "{field} does not match the required format."
one_of                     = "{field} must be one of: {allowed}."
invalid_type               = "{field} has an invalid value type."
must_differ                = "{field} must differ from {other}."
uuid                       = "{field} must be a valid UUID."
invalid_order_by_clause    = "Invalid order_by clause {clause}; expected \"field\" or \"field desc\"."
invalid_order_by_direction = "Invalid order_by direction {direction} in {clause}; use \"desc\" or omit for ascending."
unknown_order_by_field     = "Unknown order_by field {value}; supported: {allowed}."
