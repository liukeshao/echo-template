email                      = "{field} 必须是合法的邮箱地址。"
password_weak              = "{field} 必须包含至少一个字母和一个数字。"
integer                    = "{field} 必须是合法的整数。"
number                     = "{field} 必须是合法的数字。"
boolean                    = "{field} 必须是合法的布尔值。"
