[details.404]
book = "未找到 ID 为 {resource_name} 的书籍。"
user = "未找到 ID 为 {resource_name} 的用户。"

[details.409]
user.email    = "邮箱 {resource_name} 已被使用。"
user.username = "用户名 {resource_name} 已被占用。"
book.book_id  = "书籍 {resource_name} 已存在，请换一个 book_id。"

[details.413]
body_limit = "请求体大小超出允许上限（{max_bytes} 字节）。"

[details.415]
patch = "不支持的 PATCH Content-Type {content_type}；支持的值: {supported}。"

[details.429]
weather = "天气服务请求过于频繁，请稍后重试。"

[validation]
required                   = "{field} 不能为空。"
min_length                 = "{field} 长度至少为 {min} 个字符。"
max_length                 = "{field} 长度不能超过 {max} 个字符。"
max_bytes                  = "{field} 长度不能超过 {max} 字节。"
min_items                  = "{field} 至少包含 {min} 项。"
max_items                  = "{field} 最多包含 {max} 项。"
email                      = "{field} 必须是合法的邮箱地址。"
password_weak              = "{field} 必须包含至少一个字母和一个数字。"
integer                    = "{field} 必须是合法的整数。"
number                     = "{field} 必须是合法的数字。"
boolean                    = "{field} 必须是合法的布尔值。"
datetime                   = "{field} 必须是合法的 RFC3339 时间格式。"
non_negative               = "{field} 不能为负数。"
min_value                  = "{field} 不能小于 {min}。"
max_value                  = "{field} 不能大于 {max}。"
pattern                    = "{field} 格式不正确。"
one_of                     = "{field} 必须是以下值之一：{allowed}。"
invalid_type               = "{field} 的值类型不合法。"
must_differ                = "{field} 必须不同于 {other}。"
uuid                       = "{field} 必须是合法的 UUID。"
invalid_order_by_clause    = "非法的 order_by 片段 {clause}，期望格式 \"field\"、\"field asc\" 或 \"field desc\"。"
invalid_order_by_direction = "{clause} 中排序方向 {direction} 不合法，请使用 \"asc\" 或 \"desc\"。"
unknown_order_by_field     = "未知的 order_by 字段 {value}，支持: {allowed}。"
