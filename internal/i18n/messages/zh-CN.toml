min_value                  = "{field} 不能小于 {min}。"
max_value                  = "{field} 不能大于 {max}。"
pattern                    = "{field} 格式不正确。"
one_of                     = "{field} 必须是以下值之一：{allowed}。"
invalid_type               = "{field} 的值类型不合法。"
must_differ                = "{field} 必须不同于 {other}。"
uuid                       = "{field} 必须是合法的 UUID。"
