# Simplified Chinese translations.
# 结构与 en.toml 一致；仅包含面向终端用户的文本。

[errors]
# 通用 HTTP / 传输层错误码
BAD_REQUEST                  = "请求体不是合法的 JSON 格式。"
NOT_FOUND                    = "请求的资源不存在。"
METHOD_NOT_ALLOWED           = "该资源不支持当前 HTTP 方法。"
REQUEST_ENTITY_TOO_LARGE     = "请求体大小超出允许上限（{max_bytes} 字节）。"
GATEWAY_TIMEOUT              = "请求处理超时。"
CLIENT_CLOSED_REQUEST        = "客户端在服务端响应前关闭了连接。"
INTERNAL_ERROR               = "服务器内部错误。"
VALIDATION_INVALID           = "请求参数校验失败。"
PATCH_INVALID                = "PATCH 主体在 {content_type} 协议下无法解析。"
PATCH_UNSUPPORTED_MEDIA_TYPE = "不支持的 PATCH Content-Type {content_type}；支持的值: {supported}。"

# Auth 领域
AUTH_INVALID_CREDENTIALS     = "邮箱或密码错误。"
AUTH_TOKEN_INVALID           = "登录凭证无效或已过期。"
AUTH_ACCOUNT_DISABLED        = "该账户已被停用。"
AUTH_EMAIL_TAKEN             = "邮箱 {resource_name} 已被注册。"
AUTH_USERNAME_TAKEN          = "用户名 {resource_name} 已被占用。"
AUTH_INTERNAL_ERROR          = "认证过程中发生内部错误。"

# Book 领域
BOOK_NOT_FOUND               = "未找到 ID 为 {resource_name} 的书籍。"
BOOK_ALREADY_EXISTS          = "书籍 {resource_name} 已存在，请换一个 book_id。"
BOOK_INTERNAL_ERROR          = "处理书籍请求时发生内部错误。"

# Me 领域
ME_USERNAME_TAKEN            = "用户名 {resource_name} 已被占用。"
ME_EMAIL_TAKEN               = "邮箱 {resource_name} 已被使用。"
ME_INVALID_PASSWORD          = "当前密码不正确。"
ME_INTERNAL_ERROR            = "更新个人信息时发生内部错误。"

# Weather 外部客户端
WEATHER_UNAVAILABLE          = "天气服务暂时不可用。"
WEATHER_RATE_LIMITED         = "天气服务请求过于频繁，请稍后重试。"
WEATHER_INTERNAL_ERROR       = "访问天气服务时发生内部错误。"

[validation]
required                   = "{field} 不能为空。"
min_length                 = "{field} 长度至少为 {min} 个字符。"
max_length                 = "{field} 长度不能超过 {max} 个字符。"
length_range               = "{field} 长度必须在 {min} 到 {max} 个字符之间。"
username_charset           = "{field} 只能包含英文字母、数字、下划线和连字符。"
email                      = "{field} 必须是合法的邮箱地址。"
password_weak              = "{field} 必须包含至少一个字母和一个数字。"
integer                    = "{field} 必须是合法的整数。"
number                     = "{field} 必须是合法的数字。"
boolean                    = "{field} 必须是合法的布尔值。"
non_negative               = "{field} 不能为负数。"
min_value                  = "{field} 不能小于 {min}。"
max_value                  = "{field} 不能大于 {max}。"
pattern                    = "{field} 格式不正确。"
one_of                     = "{field} 必须是以下值之一：{allowed}。"
invalid_type               = "{field} 的值类型不合法。"
must_differ                = "{field} 必须不同于 {other}。"
uuid                       = "{field} 必须是合法的 UUID。"
invalid_order_by_clause    = "非法的 order_by 片段 {clause}，期望格式 \"field\" 或 \"field desc\"。"
invalid_order_by_direction = "{clause} 中排序方向 {direction} 不合法，请使用 \"desc\" 或省略以表示升序。"
unknown_order_by_field     = "未知的 order_by 字段 {value}，支持: {allowed}。"
