# Simplified Chinese translations.
# 结构与 en.toml 一致；仅包含面向终端用户的文本。

[errors]
400 = "无效的请求。"
401 = "需要身份认证或凭证无效。"
403 = "无权访问该资源。"
404 = "请求的资源不存在。"
405 = "该资源不支持当前 HTTP 方法。"
409 = "请求与当前资源状态冲突。"
413 = "请求体大小超出允许上限。"
415 = "不支持的请求媒体类型。"
429 = "请求过于频繁，请稍后重试。"
499 = "客户端在服务端响应前关闭了连接。"
500 = "服务器内部错误。"
503 = "服务暂时不可用。"
504 = "请求处理超时。"

