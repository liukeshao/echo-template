[http]
hostname = ""
port = 8000
graceful_timeout = "10s"
read_timeout = "5s"
write_timeout = "10s"
idle_timeout = "2m"
max_body_bytes = 2097152 # 2 MiB；设为 0 时使用默认值

# 可选 CORS 配置（allowed_origins 为空时默认不启用）
# [http.cors]
# allowed_origins = ["http://localhost:3000"]
# allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
# allowed_headers = ["Authorization", "Content-Type", "Accept-Language", "X-Request-ID"]
# exposed_headers = ["X-Request-ID", "Content-Language"]
# allow_credentials = false
# max_age = "10m"

[app]
name = "go-rest-template"
# 手动配置对外访问地址以构造绝对 URL，因为对外地址通常与 HTTP 监听地址不同。
host = "http://localhost:8000"
# 允许值：local / test / dev / staging / prod
environment = "local"

[auth]
# bcrypt 哈希成本（4-31）；设为 0 时使用默认值 12
bcrypt_cost = 12

[auth.jwt]
secret = "your-super-secret-jwt-key-change-this-in-production"
access_token_expiry = "15m"   # 无状态短生命周期 Access Token 过期时间
refresh_token_expiry = "168h" # 数据库托管 Refresh Token 过期时间 (7天)
issuer = "go-rest-template"   # Token 发行者

[database]
driver = "sqlite"
connection = "dbs/main.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)&_pragma=journal_mode(WAL)"
# 开发环境自动建表/同步 schema；生产环境建议设为 false 并使用显式迁移（如 Atlas）。
auto_migrate = true

# Third-party API clients.
# Each sub-table corresponds to a field in config.Clients.
[clients.weather]
base_url = "https://api.weather.com/v1"
api_key  = "change-me"
timeout  = "5s"
retry    = 2

# 国际化配置。翻译文件通过 embed.FS 打包进二进制（internal/i18n/messages/*.toml）。
# default_locale 必须同时出现在 supported_locales 中。
[i18n]
default_locale    = "en"
supported_locales = ["en", "zh-CN"]
