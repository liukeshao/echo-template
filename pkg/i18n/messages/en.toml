# English translations.
# Structure:
#   [errors]     key must equal a Code string registered in pkg/codes (e.g. "BOOK_NOT_FOUND").
#   [validation] stable keys used by pkg/validator rules and types.*.Validate().
#   [fallback]   generic messages for paths that bypass code translation.
#
# Placeholders use the {name} form and are populated by oops.With(codes.CtxKeyMetadata, ...)
# or FieldViolations.Add(field, key, vars). Missing vars are kept verbatim for easy detection.

[errors]
AUTH_INVALID_CREDENTIALS = "Invalid email or password."
AUTH_TOKEN_INVALID       = "Invalid or expired token."
AUTH_ACCOUNT_DISABLED    = "This account has been disabled."
AUTH_EMAIL_TAKEN         = "The email {email} is already registered."
AUTH_USERNAME_TAKEN      = "The username {username} is already taken."
AUTH_INTERNAL_ERROR      = "An internal error occurred during authentication."

BOOK_NOT_FOUND           = "Book {book_id} was not found."
BOOK_ALREADY_EXISTS      = "Book {book_id} already exists. Please use a different book_id."
BOOK_INTERNAL_ERROR      = "An internal error occurred while processing the book request."

ME_USERNAME_TAKEN        = "The username {username} is already taken."
ME_EMAIL_TAKEN           = "The email {email} is already in use."
ME_INVALID_PASSWORD      = "Current password is incorrect."
ME_INTERNAL_ERROR        = "An internal error occurred while updating your profile."

VALIDATION_INVALID       = "Request validation failed."

WEATHER_UNAVAILABLE      = "Weather service is temporarily unavailable."
WEATHER_RATE_LIMITED     = "Weather service rate limit exceeded. Please retry later."
WEATHER_INTERNAL_ERROR   = "An internal error occurred while contacting the weather service."

[validation]
required       = "{field} is required."
min_length     = "{field} must be at least {min} characters."
max_length     = "{field} must be at most {max} characters."
length_range   = "{field} must be between {min} and {max} characters."
charset        = "{field} may only contain {charset}."
email          = "{field} must be a valid email address."
password_weak  = "{field} must contain at least one letter and one digit."
non_negative   = "{field} must be non-negative."
must_differ    = "{field} must differ from {other}."
ulid           = "{field} must be a valid ULID (26 uppercase alphanumeric characters)."
unknown_field  = "Unknown field {field}; valid fields: {allowed}."
at_least_one   = "At least one field must be provided when update_mask is omitted."
required_for_replace = "{field} is required for full replacement (update_mask=[\"*\"])."
not_blank      = "{field} must not be blank."
invalid_order_by_clause = "Invalid order_by clause {clause}; expected \"field\" or \"field desc\"."
invalid_order_by_direction = "Invalid order_by direction {direction} in {clause}; use \"desc\" or omit for ascending."
unknown_order_by_field = "Unknown order_by field {field}; supported: {allowed}."

[fallback]
internal = "An internal server error occurred."
