# Simplified Chinese translations.
# 结构与 en.toml 一致；仅包含面向终端用户的文本。

[errors]
AUTH_INVALID_CREDENTIALS = "邮箱或密码错误。"
AUTH_TOKEN_INVALID       = "登录凭证无效或已过期。"
AUTH_ACCOUNT_DISABLED    = "该账户已被停用。"
AUTH_EMAIL_TAKEN         = "邮箱 {email} 已被注册。"
AUTH_USERNAME_TAKEN      = "用户名 {username} 已被占用。"
AUTH_INTERNAL_ERROR      = "认证过程中发生内部错误。"

BOOK_NOT_FOUND           = "未找到 ID 为 {book_id} 的书籍。"
BOOK_ALREADY_EXISTS      = "书籍 {book_id} 已存在，请换一个 book_id。"
BOOK_INTERNAL_ERROR      = "处理书籍请求时发生内部错误。"

ME_USERNAME_TAKEN        = "用户名 {username} 已被占用。"
ME_EMAIL_TAKEN           = "邮箱 {email} 已被使用。"
ME_INVALID_PASSWORD      = "当前密码不正确。"
ME_INTERNAL_ERROR        = "更新个人信息时发生内部错误。"

VALIDATION_INVALID       = "请求参数校验失败。"

WEATHER_UNAVAILABLE      = "天气服务暂时不可用。"
WEATHER_RATE_LIMITED     = "天气服务请求过于频繁，请稍后重试。"
WEATHER_INTERNAL_ERROR   = "访问天气服务时发生内部错误。"

[validation]
required       = "{field} 不能为空。"
min_length     = "{field} 长度至少为 {min} 个字符。"
max_length     = "{field} 长度不能超过 {max} 个字符。"
length_range   = "{field} 长度必须在 {min} 到 {max} 个字符之间。"
charset        = "{field} 只能包含 {charset}。"
email          = "{field} 必须是合法的邮箱地址。"
password_weak  = "{field} 必须包含至少一个字母和一个数字。"
non_negative   = "{field} 不能为负数。"
must_differ    = "{field} 必须不同于 {other}。"
ulid           = "{field} 必须是合法的 ULID（26 位大写字母或数字）。"
unknown_field  = "未知字段 {field}，可选字段: {allowed}。"
at_least_one   = "省略 update_mask 时，至少需要提供一个字段。"
required_for_replace = "执行全量替换（update_mask=[\"*\"]）时 {field} 为必填。"
not_blank      = "{field} 不能为空白字符。"
invalid_order_by_clause = "非法的 order_by 片段 {clause}，期望格式 \"field\" 或 \"field desc\"。"
invalid_order_by_direction = "{clause} 中排序方向 {direction} 不合法，请使用 \"desc\" 或省略以表示升序。"
unknown_order_by_field = "未知的 order_by 字段 {field}，支持: {allowed}。"

[fallback]
internal = "服务器内部错误。"
